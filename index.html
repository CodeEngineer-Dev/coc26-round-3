<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      canvas {
        outline: 1px solid black;
        position: absolute;
        top: 0;
        left: 0;
        width: 600;
        height: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="render" width="600" height="600"></canvas>
    <canvas id="overlay" width="600" height="600"></canvas>
    <canvas id="debug" width="600" height="600"></canvas>
    <script type src="scripts/utils.js"></script>
    <script type src="scripts/input-handler.js"></script>
    <script type src="scripts/debug-renderer.js"></script>
    <script type src="scripts/grid.js"></script>
    <script type src="scripts/player.js"></script>
    <script type src="scripts/enemy.js"></script>

    <script type>
      (function () {
        let grid = createGrid();

        // spawns walls
        for (let i of grid) {
          if (Math.random() < 0.05) {
            //i.type = "wall";
            //i.isFloor = false;
          }
        }
        //*/

        let displayGrid = grid.map((val, i) => {
          return {
            pos: {
              x: getTileLocation(i).x + 0.5,
              y: getTileLocation(i).y + 0.5,
            },
            size: { w: 1, h: 1 },
            debugFill: val.type == "wall" ? "#00000080" : "#00000000",
            debugStroke: "#EEEEEE",
          };
        });

        let projectiles = [];

        /*
          Configuration options for an enemy:

          {
            movement: {
              type: "chase" | "orbit" | "wander",
              speed: number
            },
            size: {
              w: number,
              h: number,
              r: number
            },
            engagement: {
              maxDist: number,
              minDist: number,
              preferredDist: number,
            },
            attack: {
              type: "bullet",
              spatial: {
                type: "single" | "shotgun" | "radial" | "spiral",
                number: number,
                aimed: boolean,
                spiralPause: number,
                shotgunAngleRange: number
              },
              firing: {
                type: "constant" | "burst",
                frequency: number,
                burstNumber: number,
                burstPause: number,
              },
              projectile: {
                speed: number,
                modifiers: "none" | "bounce" | "split" | "pierce",
                damage: number
              },
              timing: {
                windup: number,
                cooldown: number
              }
            },
            tag: string,
            health: number
          }
        */
        let sampleEnemyConfig = {
          movement: {
            type: "chase",
            speed: 0.03,
          },
          size: {
            w: 0.7,
            h: 0.7,
            r: 0.35,
          },
          engagement: {
            maxDist: 15,
            minDist: 5,
            preferredDist: 10,
          },
          attack: {
            type: "bullet",
            spatial: {
              type: "spiral",
              number: 15,
              aimed: false,
              spiralPause: 5,
              shotgunAngleRange: Math.PI / 4,
            },
            firing: {
              type: "burst",
              frequency: 300,
              burstNumber: 3,
              burstPause: 30,
            },
            projectile: {
              speed: 0.1,
              modifiers: "none",
              damage: 5,
            },
            timing: {
              windup: 60,
              cooldown: 30,
            },
            tag: "string",
          },
        };

        let player = new Player(16, 16);
        let enemy = new Enemy(sampleEnemyConfig, { x: 8, y: 8 }, projectiles);

        function main() {
          prepDebugCanvas();

          player.handleUserInput();
          player.move(grid);

          enemy.update(grid, player);

          for (let projectile of projectiles) {
            projectile.update();
          }

          debugRender(displayGrid);
          debugRender(player);
          debugRender(enemy);
          debugRender(projectiles);

          requestAnimationFrame(main);
        }
        requestAnimationFrame(main);
      })();
    </script>
  </body>
</html>
