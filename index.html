<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      canvas {
        outline: 1px solid black;
        position: absolute;
        top: 0;
        left: 0;
        width: 600;
        height: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="render" width="600" height="600"></canvas>
    <canvas id="overlay" width="600" height="600"></canvas>
    <canvas id="debug" width="600" height="600"></canvas>
    <script type src="scripts/utils.js"></script>
    <script type src="scripts/input-handler.js"></script>
    <script type src="scripts/debug-renderer.js"></script>
    <script type src="scripts/grid.js"></script>
    <script type src="scripts/player.js"></script>
    <script type src="scripts/enemy.js"></script>

    <script type>
      (function () {
        let player = new Player(4, 4);

        let enemy = new Enemy(
          {
            movement: { speed: 0.02 },
            size: { w: 0.7, h: 0.7, r: 0.35 },
            engagement: { maxDist: 6, minDist: 2, preferredDist: 4 },
          },
          { x: 8, y: 8 },
        );

        let grid = createGrid();

        // spawns walls
        for (let i of grid) {
          if (Math.random() < 0.02) {
            i.type = "wall";
            i.isFloor = false;
          }
        }
        //*/

        let displayGrid = grid.map((val, i) => {
          return {
            pos: {
              x: getTileLocation(i).x + 0.5,
              y: getTileLocation(i).y + 0.5,
            },
            size: { w: 1, h: 1 },
            debugFill: val.type == "wall" ? "#FF000080" : "#00000000",
            debugStroke: "#EEEEEE",
          };
        });

        function main() {
          prepDebugCanvas();

          player.handleUserInput();
          player.move(grid);

          enemy.update(grid, player);

          debugRender(displayGrid);
          debugRender(player);
          debugRender(enemy.movement);

          requestAnimationFrame(main);
        }
        requestAnimationFrame(main);
      })();
    </script>
  </body>
</html>
