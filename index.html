<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      canvas {
        outline: 1px solid black;
        position: absolute;
        top: 0;
        left: 0;
        width: 600;
        height: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="render" width="600" height="600"></canvas>
    <canvas id="overlay" width="600" height="600"></canvas>
    <canvas id="debug" width="600" height="600"></canvas>
    <script type src="scripts/utils.js"></script>
    <script type src="scripts/input-handler.js"></script>
    <script type src="scripts/debug-renderer.js"></script>
    <script type src="scripts/grid.js"></script>
    <script type src="scripts/player.js"></script>
    <script type src="scripts/enemy.js"></script>

    <script type>
      (function () {
        /*
        - attack
          - type (options: laser, bomb, bullet)
          - weapon configuration (options: single, shotgun, radial, spiral)
          - fire pattern (options: constant, burst)
          - projectile configuration
              - speed
              - modifiers (options: pierce, bounce, split, homing, acceleration, slowing)
              - damage done
        - timing
            - telegraph time
            - cooldown
            - wind up time
            - cancelable
            - recovery
        */

        let grid = createGrid();

        // spawns walls
        for (let i of grid) {
          if (Math.random() < 0.05) {
            //i.type = "wall";
            //i.isFloor = false;
          }
        }
        //*/
        /*
        class Projectile {
          constructor(config, pos, dir) {
            this.type = config.type;
            this.prevPos = {
              x: pos.x,
              y: pos.y,
            };
            this.pos = {
              x: pos.x,
              y: pos.y,
            };
            this.size = {
              r: 0.2,
            };
            this.direction = {
              x: dir.x,
              y: dir.y,
            };
            this.speed = config.speed;
            this.damage = config.damage;
          }
          update() {
            this.prevPos.x = this.pos.x;
            this.prevPos.y = this.pos.y;

            let velX = this.direction.x * this.speed;
            let velY = this.direction.y * this.speed;

            this.pos.y += velY;
            this.pos.x += velX;
          }
        }
        */

        let displayGrid = grid.map((val, i) => {
          return {
            pos: {
              x: getTileLocation(i).x + 0.5,
              y: getTileLocation(i).y + 0.5,
            },
            size: { w: 1, h: 1 },
            debugFill: val.type == "wall" ? "#00000080" : "#00000000",
            debugStroke: "#EEEEEE",
          };
        });

        let projectiles = [];
        let sampleEnemyConfig = {
          movement: {
            type: "chase",
            speed: 0.03,
          },
          size: {
            w: 0.7,
            h: 0.7,
            r: 0.35,
          },
          engagement: {
            maxDist: 10,
            minDist: 3,
            preferredDist: 7,
            losRequired: true,
          },
          attack: {
            type: "bullet",
            spatial: {
              type: "spiral",
              number: 12,
              aimed: true,
              spiralPause: 10,
            },
            firing: {
              type: "constant",
              frequency: 300,
            },
            projectile: {
              speed: 0.1,
              modifiers: "none",
              damage: 5,
            },
            timing: {
              windup: 30,
              cooldown: 30,
            },
          },
        };

        let player = new Player(16, 16);
        let enemy = new Enemy(sampleEnemyConfig, { x: 8, y: 8 }, projectiles);

        function main() {
          prepDebugCanvas();

          player.handleUserInput();
          player.move(grid);

          enemy.update(grid, player);

          for (let projectile of projectiles) {
            projectile.update();
          }

          debugRender(displayGrid);
          debugRender(player);
          debugRender(enemy);
          debugRender(projectiles);

          requestAnimationFrame(main);
        }
        requestAnimationFrame(main);
      })();
    </script>
  </body>
</html>
