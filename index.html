<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      canvas {
        outline: 1px solid black;
        position: absolute;
        top: 0;
        left: 0;
        width: 600;
        height: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="render" width="600" height="600"></canvas>
    <canvas id="overlay" width="600" height="600"></canvas>
    <canvas id="debug" width="600" height="600"></canvas>
    <script type src="scripts/utils.js"></script>
    <script type src="scripts/input-handler.js"></script>
    <script type src="scripts/debug-renderer.js"></script>
    <script type src="scripts/grid.js"></script>
    <script type src="scripts/room-generator.js"></script>
    <script type src="scripts/attack.js"></script>
    <script type src="scripts/player.js"></script>
    <script type src="scripts/enemy.js"></script>

    <script type>
      (function () {
        let grid = createRoom({
          type: "symmetric",
          symmetryType: "xy",
          wallNumber: 1,
          holeNumber: 2,
          clusterSize: {
            w: 3,
            h: 2,
          },
        });

        let displayGrid = grid.map((val, i) => {
          return {
            pos: {
              x: getTileLocation(i).x + 0.5,
              y: getTileLocation(i).y + 0.5,
            },
            size: { w: 1, h: 1 },
            debugFill:
              val.type == "wall"
                ? "#00000080"
                : val.type == "hole"
                  ? "#00330080"
                  : val.type == "door"
                    ? "#88888880"
                    : "#00000000",
            debugStroke: "#EEEEEE",
          };
        });

        let enemyProjectiles = [];
        let playerProjectiles = [];

        /*
          Configuration options for an enemy:

          {
            movement: {
              type: "chase" | "orbit" | "wander",
              speed: number
            },
            size: {
              w: number,
              h: number,
              r: number
            },
            engagement: {
              maxDist: number,
              minDist: number,
              preferredDist: number,
              losRequired: boolean
            },
            attack: {
              type: "bullet",
              spatial: {
                type: "single" | "shotgun" | "radial" | "spiral",
                number: number,
                aimed: boolean,
                spiralPause: number,
                shotgunAngleRange: number
              },
              firing: {
                type: "constant" | "burst",
                frequency: number,
                burstNumber: number,
                burstPause: number,
              },
              projectile: {
                speed: number,
                modifiers: "none" | "bounce" | "split" | "pierce",
                damage: number
              },
              timing: {
                windup: number,
                cooldown: number
              }
            },
            tag: string,
            health: number
          }
        */
        let sampleEnemyConfig = {
          movement: {
            type: "chase",
            speed: 0.03,
          },
          size: {
            w: 0.7,
            h: 0.7,
            r: 0.35,
          },
          engagement: {
            maxDist: 15,
            minDist: 5,
            preferredDist: 10,
            requiresLOS: true,
          },
          attack: {
            type: "bullet",
            spatial: {
              type: "single",
              number: 15,
              aimed: true,
              spiralPause: 5,
              shotgunAngleRange: Math.PI / 4,
            },
            firing: {
              type: "burst",
              frequency: 300,
              burstNumber: 3,
              burstPause: 30,
            },
            projectile: {
              speed: 0.1,
              modifiers: "none",
              damage: 5,
            },
            timing: {
              windup: 60,
              cooldown: 30,
            },
          },
          tag: "string",
          health: 100,
        };
        let samplePlayerConfig = {
          attack: {
            type: "bullet",
            spatial: {
              type: "single",
              number: 6,
              aimed: true,
              spiralPause: 0,
              shotgunAngleRange: Math.PI / 4,
            },
            firing: {
              type: "burst",
              frequency: 240,
              burstNumber: 3,
              burstPause: 30,
            },
            projectile: {
              speed: 0.1,
              modifiers: "none",
              damage: 20,
            },
            timing: {
              windup: 0,
              cooldown: 0,
            },
          },
        };

        let player = new Player(
          samplePlayerConfig,
          { x: GRID_WIDTH / 2, y: GRID_HEIGHT / 2 },
          playerProjectiles,
        );

        let enemies = [];
        enemies.push(
          new Enemy(
            sampleEnemyConfig,
            { x: GRID_WIDTH / 4, y: GRID_HEIGHT / 4 },
            enemyProjectiles,
          ),
        );
        enemies.push(
          new Enemy(
            sampleEnemyConfig,
            { x: (GRID_WIDTH * 3) / 4, y: (GRID_HEIGHT * 3) / 4 },
            enemyProjectiles,
          ),
        );

        function main() {
          prepDebugCanvas();

          player.handleUserInput();
          player.update(grid, enemies);

          for (let enemy of enemies) {
            enemy.update(grid, player);
          }

          for (let projectile of enemyProjectiles) {
            projectile.update();
          }
          for (let projectile of playerProjectiles) {
            projectile.update();
          }

          // Empty grid
          clearGridEntities(grid);

          // Locate enemies in grid
          for (let enemy of enemies) {
            let minX = Math.floor(enemy.pos.x - enemy.size.w / 2);
            let maxX = Math.floor(enemy.pos.x + enemy.size.w / 2);

            let minY = Math.floor(enemy.pos.y - enemy.size.h / 2);
            let maxY = Math.floor(enemy.pos.y + enemy.size.h / 2);

            for (let i = minX; i <= maxX; i++) {
              for (let j = minY; j <= maxY; j++) {
                getGridTile(grid, i, j).entitiesContained.push(enemy);
              }
            }
          }
          // Locate player in grid
          {
            let minX = Math.floor(player.pos.x - player.size.w / 2);
            let maxX = Math.floor(player.pos.x + player.size.w / 2);

            let minY = Math.floor(player.pos.y - player.size.h / 2);
            let maxY = Math.floor(player.pos.y + player.size.h / 2);

            for (let i = minX; i <= maxX; i++) {
              for (let j = minY; j <= maxY; j++) {
                getGridTile(grid, i, j).entitiesContained.push(player);
              }
            }
          }

          // Now for projectile collisions

          // First, player projectiles
          for (let i = playerProjectiles.length - 1; i > -1; i--) {
            let bulletGridX = Math.floor(playerProjectiles[i].pos.x);
            let bulletGridY = Math.floor(playerProjectiles[i].pos.y);
            let gridTile = getGridTile(grid, bulletGridX, bulletGridY);
            let projectile = playerProjectiles[i];

            if (gridTile.blocksLOS) {
              playerProjectiles[i] =
                playerProjectiles[playerProjectiles.length - 1];
              playerProjectiles.pop();
            } else {
              for (let entity of gridTile.entitiesContained) {
                if (
                  entity instanceof Enemy &&
                  pointCircle(
                    projectile.pos.x,
                    projectile.pos.y,
                    entity.pos.x,
                    entity.pos.y,
                    entity.size.r,
                  )
                ) {
                  entity.health -= projectile.damage;
                  playerProjectiles[i] =
                    playerProjectiles[playerProjectiles.length - 1];
                  playerProjectiles.pop();
                }
              }
            }
          }

          // Then, enemy projectiles
          for (let i = enemyProjectiles.length - 1; i > -1; i--) {
            let bulletGridX = Math.floor(enemyProjectiles[i].pos.x);
            let bulletGridY = Math.floor(enemyProjectiles[i].pos.y);
            let gridTile = getGridTile(grid, bulletGridX, bulletGridY);
            let projectile = enemyProjectiles[i];

            if (gridTile.blocksLOS) {
              enemyProjectiles[i] =
                enemyProjectiles[enemyProjectiles.length - 1];
              enemyProjectiles.pop();
            } else {
              for (let entity of gridTile.entitiesContained) {
                if (
                  entity instanceof Player &&
                  pointCircle(
                    projectile.pos.x,
                    projectile.pos.y,
                    entity.pos.x,
                    entity.pos.y,
                    entity.size.r,
                  )
                ) {
                  entity.health -= projectile.damage;
                  enemyProjectiles[i] =
                    enemyProjectiles[enemyProjectiles.length - 1];
                  enemyProjectiles.pop();
                }
              }
            }
          }

          // Now handle removing dead enemies
          for (let i = enemies.length - 1; i > -1; i--) {
            if (enemies[i].health <= 0) {
              enemies[i] = enemies[enemies.length - 1];
              enemies.pop();
            }
          }

          debugRender(displayGrid);
          debugRender(player);
          debugRender(enemies);
          debugRender(enemyProjectiles);
          debugRender(playerProjectiles);

          requestAnimationFrame(main);
        }
        requestAnimationFrame(main);
      })();
    </script>
  </body>
</html>
