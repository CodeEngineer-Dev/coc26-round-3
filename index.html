<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }
      canvas {
        outline: 1px solid black;
        position: absolute;
        top: 0;
        left: 0;
        width: 600;
        height: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="render" width="600" height="600"></canvas>
    <canvas id="overlay" width="600" height="600"></canvas>
    <canvas id="debug" width="600" height="600"></canvas>
    <script type src="scripts/utils.js"></script>
    <script type src="scripts/input-handler.js"></script>
    <script type src="scripts/debug-renderer.js"></script>
    <script type src="scripts/grid.js"></script>
    <script type src="scripts/attack.js"></script>
    <script type src="scripts/player.js"></script>
    <script type src="scripts/enemy.js"></script>
    <script type src="scripts/room-generator.js"></script>
    <script type src="scripts/dungeon-generator.js"></script>
    <script type src="scripts/level-manager.js"></script>

    <script type>
      (function () {
        let currentLevel = new LevelManager(0, currentPlayerConfig);

        function main() {
          prepDebugCanvas();
          currentLevel.update();
          currentLevel.display();

          requestAnimationFrame(main);
        }
        requestAnimationFrame(main);
      })();
    </script>
  </body>
</html>
