                `pointLights[${lightIndex}].diffuse`,
                material?.emissiveFactor,
              );
              shader.setUniform(
                `pointLights[${lightIndex}].specular`,
                material?.emissiveFactor,
              );
              shader.setUniform(`pointLights[${lightIndex}].constant`, 1);
              shader.setUniform(
                `pointLights[${lightIndex}].linear`,
                4.5 / light.light?.lightRange,
              );
              shader.setUniform(
                `pointLights[${lightIndex}].quadratic`,
                75 / (light.light?.lightRange * light.light?.lightRange),
              );
              let translation = glMatrix.vec3.create();
              glMatrix.mat4.getTranslation(translation, light.transform);
              shader.setUniform(
                `pointLights[${lightIndex}].position`,
                translation,
              );
            }
            // Set number of spot lights.
            if (primitiveList.light.spotLight.length > MAX_SPOT_LIGHTS)
              throw new Error("Too many point lights!");
            shader.setUniform(
              "numSpotLights",
              primitiveList.light.spotLight.length,
            );
            // Loop through the spot light array in the shader and set uniforms.
            for (const lightIndex in primitiveList.light.spotLight) {
              const light = primitiveList.light.spotLight[lightIndex];
              const material = this.assetManager.getMaterial(
                light.material.folder,
                light.material.index,
              );
              shader.setUniform(`spotLights[${lightIndex}].ambient`, [
                material?.emissiveFactor[0] * 0.1,
                material?.emissiveFactor[1] * 0.1,
                material?.emissiveFactor[2] * 0.1,
              ]);
              shader.setUniform(
                `spotLights[${lightIndex}].diffuse`,
                material?.emissiveFactor,
              );
              shader.setUniform(
                `spotLights[${lightIndex}].specular`,
                material?.emissiveFactor,
              );
              shader.setUniform(`spotLights[${lightIndex}].constant`, 1);
              shader.setUniform(
                `spotLights[${lightIndex}].linear`,
                4.5 / light.light?.lightRange,
              );
              shader.setUniform(
                `spotLights[${lightIndex}].quadratic`,
                75 / (light.light?.lightRange * light.light?.lightRange),
              );
              let translation = glMatrix.vec3.create();
              glMatrix.mat4.getTranslation(translation, light.transform);
              shader.setUniform(
                `spotLights[${lightIndex}].position`,
                translation,
              );
              shader.setUniform(
                `spotLights[${lightIndex}].direction`,
                light.light?.direction,
              );
              shader.setUniform(
                `spotLights[${lightIndex}].cutOff`,
                light.light?.cutOff,
              );
              shader.setUniform(
                `spotLights[${lightIndex}].outerCufOff`,
                light.light?.outerCutOff,
              );
            }

            let lastBoundEmissive = null;

            // Solid colored primitives
            shader.setUniform("pbr_material.isTexture", false);
            shader.setUniform("pbr_material.isMRt", false);
            shader.setUniform("isNormalMap", false);
            const solids = primitiveList.opaque.solid;
            for (const primitive of solids) {
              shader.setUniform("model", primitive.transform);
              shader.setUniform("normalMatrix", primitive.normalMatrix);
              const material = this.assetManager.getMaterial(
                primitive.material.folder,
                primitive.material.index,
              );
              shader.setUniform(
                "pbr_material.albedo",
                material?.pbrMetallicRoughness.baseColorFactor,
              );
              shader.setUniform(
                "pbr_material.metalness",
                material?.pbrMetallicRoughness.metallicFactor ?? 0,
              );
              shader.setUniform(
                "pbr_material.roughness",
                material?.pbrMetallicRoughness.roughnessFactor ?? 0,
              );

              if ("emissiveFactor" in material) {
                shader.setUniform("emissiveFactor", primitive.emissiveFactor);
                shader.setUniform(
                  "emissiveStrength",
                  primitive.emissiveStrength,
                );

                if ("emissiveTexture" in material) {
                  let emissiveTexLoc = this.assetManager.getTexture(
                    folder,
                    Number(material.emissiveTexture.index),
                  );
                  shader.setUniform("isEmissiveMap", true);
                  if (emissiveTexLoc != lastBoundEmissive) {
                    this.gl.activeTexture(this.gl.TEXTURE3);
                    this.gl.bindTexture(this.gl.TEXTURE_2D, emissiveTexLoc);
                    shader.setUniform("emissiveMap", 3);
                    lastBoundEmissive = emissiveTexLoc;
                  }
                } else {
                  shader.setUniform("isEmissiveMap", false);
                }
              } else {
                shader.setUniform("emissiveFactor", [0, 0, 0]);
                shader.setUniform("isEmissiveMap", false);
              }

              this.gl.bindVertexArray(primitive.vao);
              this.gl.drawElements(
                primitive.mode,
                primitive.count,
                primitive.type,
                primitive.offset,
              );
              this.gl.bindVertexArray(null);
            }
            // Textured primitives
            let lastBoundAlbedo = null;
            let lastBoundNormal = null;
            let lastBoundRoughMetal = null;

            shader.setUniform("pbr_material.isTexture", true);

            const textures = primitiveList.opaque.texture;
            for (const folder in textures) {
              for (const index in textures[folder]) {
                if (
                  this.assetManager.getTexture(folder, Number(index)) !=
                  lastBoundAlbedo
                ) {
                  this.gl.activeTexture(this.gl.TEXTURE0);
                  this.gl.bindTexture(
                    this.gl.TEXTURE_2D,
                    this.assetManager.getTexture(folder, Number(index)),
                  );
                  shader.setUniform("pbr_material.albedoMap", 0);
                  lastBoundAlbedo = this.assetManager.getTexture(
                    folder,
                    Number(index),
                  );
                }

                for (const primitive of textures[folder][index]) {
                  shader.setUniform("model", primitive.transform);
                  shader.setUniform("normalMatrix", primitive.normalMatrix);
                  const material = this.assetManager.getMaterial(
                    primitive.material.folder,
                    primitive.material.index,
                  );

                  if ("normalTexture" in material) {
                    let normTexLoc = this.assetManager.getTexture(
                      folder,
                      Number(material.normalTexture.index),
                    );
                    if (normTexLoc != lastBoundNormal) {
                      shader.setUniform("isNormalMap", true);
                      this.gl.activeTexture(this.gl.TEXTURE2);
                      this.gl.bindTexture(this.gl.TEXTURE_2D, normTexLoc);
                      shader.setUniform("normalMap", 2);
                      lastBoundNormal = normTexLoc;
                      shader.setUniform("isNormalMap", false);
                    }
                  } else {
                    shader.setUniform("isNormalMap", false);
                  }

                  if (
                    "metallicRoughnessTexture" in material.pbrMetallicRoughness
                  ) {
                    let texLoc = this.assetManager.getTexture(
                      folder,
                      Number(
                        material.pbrMetallicRoughness.metallicRoughnessTexture
                          .index,
                      ),
                    );
                    if (texLoc != lastBoundRoughMetal) {
                      shader.setUniform("pbr_material.isMRt", true);
                      this.gl.activeTexture(this.gl.TEXTURE1);
                      this.gl.bindTexture(this.gl.TEXTURE_2D, texLoc);
                      shader.setUniform("pbr_material.MRmap", 1);
                      lastBoundRoughMetal = texLoc;
                    }
                  } else {
                    shader.setUniform("pbr_material.isMRt", false);
                    shader.setUniform(
                      "pbr_material.metalness",
                      material?.pbrMetallicRoughness.metallicFactor ?? 0,
                    );
                    shader.setUniform(
                      "pbr_material.roughness",
                      material?.pbrMetallicRoughness.roughnessFactor ?? 0,
                    );
                  }

                  if ("emissiveFactor" in material) {
                    shader.setUniform(
                      "emissiveFactor",
                      primitive.emissiveFactor,
                    );
                    shader.setUniform(
                      "emissiveStrength",
                      primitive.emissiveStrength,
                    );

                    if ("emissiveTexture" in material) {
                      let emissiveTexLoc = this.assetManager.getTexture(
                        folder,
                        Number(material.emissiveTexture.index),
                      );
                      shader.setUniform("isEmissiveMap", true);
                      if (emissiveTexLoc != lastBoundEmissive) {
                        this.gl.activeTexture(this.gl.TEXTURE3);
                        this.gl.bindTexture(this.gl.TEXTURE_2D, emissiveTexLoc);
                        shader.setUniform("emissiveMap", 3);
                        lastBoundEmissive = emissiveTexLoc;
                      }
                    } else {
                      shader.setUniform("isEmissiveMap", false);
                    }
                  } else {
                    shader.setUniform("emissiveFactor", [0, 0, 0]);
                    shader.setUniform("isEmissiveMap", false);
                  }

                  this.gl.bindVertexArray(primitive.vao);
                  this.gl.drawElements(
                    primitive.mode,
                    primitive.count,
                    primitive.type,
                    primitive.offset,
                  );
                  this.gl.bindVertexArray(null);
                }
              }
            }

            this.gl.disable(this.gl.CULL_FACE);
            // Textured primitives
            const texturedTransparents = primitiveList.blend.texture;
            for (const folder in texturedTransparents) {
              for (const index in texturedTransparents[folder]) {
                this.gl.activeTexture(this.gl.TEXTURE0);
                this.gl.bindTexture(
                  this.gl.TEXTURE_2D,
                  this.assetManager.getTexture(folder, Number(index)),
                );
                shader.setUniform("pbr_material.albedoMap", 0);

                for (const primitive of texturedTransparents[folder][index]) {
                  shader.setUniform("model", primitive.transform);
                  shader.setUniform("normalMatrix", primitive.normalMatrix);
                  const material = this.assetManager.getMaterial(
                    primitive.material.folder,
                    primitive.material.index,
                  );

                  shader.setUniform(
                    "pbr_material.metalness",
                    material?.pbrMetallicRoughness.metallicFactor ?? 0,
                  );
                  shader.setUniform(
                    "pbr_material.roughness",
                    material?.pbrMetallicRoughness.roughnessFactor ?? 0,
                  );
                  this.gl.bindVertexArray(primitive.vao);
                  this.gl.drawElements(
                    primitive.mode,
                    primitive.count,
                    primitive.type,
                    primitive.offset,
                  );
                  this.gl.bindVertexArray(null);
                }
              }
            }
            this.gl.enable(this.gl.CULL_FACE);

            // Lights use a different shader
            shader = this.shader["light"];
            shader.use();
            shader.setUniform("viewProjection", viewProjection);
            // Draw the lights
            for (let primitive of primitiveList.light.pointLight) {
              if ("lightTexture" in primitive) {
                shader.setUniform("isTexture", true);
                this.gl.activeTexture(this.gl.TEXTURE0);
                this.gl.bindTexture(
                  this.gl.TEXTURE_2D,
                  this.assetManager.getTexture(
                    primitive.lightTexture.folder,
                    primitive.lightTexture.index,
                  ),
                );
                shader.setUniform("textureMap", 0);
              } else {
                shader.setUniform("isTexture", false);
                shader.setUniform(
                  "emissiveFactor",
                  this.assetManager.getMaterial(
                    primitive.material.folder,
                    primitive.material.index,
                  )?.emissiveFactor,
                );
              }

              shader.setUniform("model", primitive.transform);

              this.gl.bindVertexArray(primitive.vao);
              this.gl.drawElements(
                primitive.mode,
                primitive.count,
                primitive.type,
                primitive.offset,
              );
              this.gl.bindVertexArray(null);
            }
            for (let primitive of primitiveList.light.spotLight) {
              shader.setUniform("model", primitive.transform);
              shader.setUniform(
                "emissiveFactor",
                this.assetManager.getMaterial(
                  primitive.material.folder,
                  primitive.material.index,
                )?.emissiveFactor,
              );
              this.gl.bindVertexArray(primitive.vao);
              this.gl.drawElements(
                primitive.mode,
                primitive.count,
                primitive.type,
                primitive.offset,
              );
              this.gl.bindVertexArray(null);
            }
          }
        }
        return { Renderer, RenderComponent };
      })();

    <script type>
      var [debugRender, prepDebugCanvas] = (function () {
        const canvas = document.getElementById("debug");
        const ctx = canvas.getContext("2d");
        const SCALE = 35;

        function debugRenderSingle(i) {
          if ("pos" in i && "size" in i) {
            ctx.beginPath();
            if ("w" in i.size && "h" in i.size) {
              ctx.rect(
                (i.pos.x - i.size.w / 2) * SCALE,
                (i.pos.y - i.size.h / 2) * SCALE,
                i.size.w * SCALE,
                i.size.h * SCALE,
              );
            } else if ("r" in i.size) {
              ctx.arc(
                i.pos.x * SCALE,
                i.pos.y * SCALE,
                i.size.r * SCALE,
                0,
                2 * Math.PI,
              );
            } else if ("x2" in i.pos && "y2" in i.pos) {
              ctx.moveTo(i.pos.x * SCALE, i.pos.y * SCALE);
              ctx.lineTo(i.pos.x2 * SCALE, i.pos.y2 * SCALE);
            }

            ctx.strokeStyle = i.debugStroke || "#000000";
            ctx.fillStyle = i.debugFill || "#00000010";
            ctx.fill();
            ctx.stroke();
            ctx.closePath();
          }
        }
        function debugRenderArray(entities) {
          for (let i of entities) {
            debugRenderSingle(i);
          }
        }
        function debugRender(object) {
          if (Array.isArray(object)) debugRenderArray(object);
          else debugRenderSingle(object);
        }
        function prepDebugCanvas() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        return [debugRender, prepDebugCanvas];
      })();
    </script>
    <!-- grid -->
    <script type>
      var [
        createGrid,
        getGridTile,
        setGridTile,
        getTileLocation,
        DDA,
        handleGridCollision,
        clearGridEntities,
        GRID_WIDTH,
        GRID_HEIGHT,
      ] = (function () {
        const WIDTH = 16;
        const HEIGHT = 16;

        /*
    Comes from https://lodev.org/cgtutor/raycasting.html

    Ideas for optimization:

    store integers and use bitmap flags for a grid
  */
        function createGrid() {
          return new Array(WIDTH * HEIGHT).fill(null).map((value) => {
            return {
              type: "",
              blocksLOS: false,
              blocksMovement: false,
              entitiesContained: [],
            };
          });
        }
        function getGridTile(grid, x, y) {
          if (x < WIDTH && y < HEIGHT) {
            return grid[y * WIDTH + x];
          } else {
            throw new Error("Value not in grid");
          }
        }
        function getTileLocation(index) {
          return { x: index % WIDTH, y: Math.floor(index / HEIGHT) };
        }
        function setGridTile(grid, x, y, value) {
          if (x < WIDTH && y < HEIGHT) {
            grid[y * WIDTH + x] = value;
          } else {
            throw new Error("Value not in grid");
          }
        }
        function clearGridEntities(grid) {
          for (let i of grid) {
            i.entitiesContained.length = 0;
          }
        }

        function DDA(grid, x, y, angle) {
          angle = angle % (2 * Math.PI);
          if (angle < 0) angle += 2 * Math.PI;

          let rayDirX = Math.cos(angle);
          let rayDirY = Math.sin(angle);

          let mapX = Math.floor(x);
          let mapY = Math.floor(y);

          let sideDistX;
          let sideDistY;
          let perpWallDist;

          let deltaDistX = Math.abs(1 / rayDirX);
          let deltaDistY = Math.abs(1 / rayDirY);

          let stepX;
          let stepY;

          let hit = 0;
          let side;

          if (rayDirX < 0) {
            stepX = -1;
            sideDistX = (x - mapX) * deltaDistX;
          } else {
            stepX = 1;
            sideDistX = (mapX + 1.0 - x) * deltaDistX;
          }

          if (rayDirY < 0) {
            stepY = -1;
            sideDistY = (y - mapY) * deltaDistY;
          } else {
            stepY = 1;
            sideDistY = (mapY + 1.0 - y) * deltaDistY;
          }

          let cellsIntersected = [];

          while (hit == 0) {
            if (sideDistX < sideDistY) {
              sideDistX += deltaDistX;
              mapX += stepX;
              side = 0;
            } else {
              sideDistY += deltaDistY;
              mapY += stepY;
              side = 1;
            }

            if (mapX < 0 || mapX >= WIDTH) hit = 2;
            else if (mapY < 0 || mapY >= HEIGHT) hit = 2;
            else if (getGridTile(grid, mapX, mapY).blocksLOS) hit = 1;
            else cellsIntersected.push({ x: mapX, y: mapY });
          }

          if (side == 0) {
            perpWallDist = sideDistX - deltaDistX;
          } else {
            perpWallDist = sideDistY - deltaDistY;
          }

          if (hit == 1) {
            let normal;

            if (side == 0) {
              if (stepX == -1) normal = "right";
              else if (stepX == 1) normal = "left";
            } else if (side == 1) {
              if (stepY == -1) normal = "bottom";
              else if (stepY == 1) normal = "top";
            }

            return {
              hit: true,
              hitPosition: {
                x: x + perpWallDist * rayDirX,
                y: y + perpWallDist * rayDirY,
              },
              hitCell: { x: mapX, y: mapY },
              distanceTraveled: side == 0 ? sideDistX : sideDistY,
              normalHit: normal,
              cellsIntersected,
            };
          } else {
            return {
              hit: false,
              hitPosition: {
                x: x + perpWallDist * rayDirX,
                y: y + perpWallDist * rayDirY,
              },
              cellsIntersected,
            };
          }
        }

        function handleGridCollision(grid, entity, direction) {
          const FLOATING_POINT_MARGIN = 0.001;
          if (direction == "x") {
            if (entity.dir.x > 0) {
              let tileX = Math.floor(entity.pos.x + entity.size.w / 2);
              let minY = Math.floor(entity.pos.y - entity.size.h / 2);
              let maxY = Math.floor(entity.pos.y + entity.size.h / 2);

              for (var y = minY; y <= maxY; y++) {
                if (getGridTile(grid, tileX, y).blocksMovement) {
                  entity.pos.x =
                    tileX - entity.size.w / 2 - FLOATING_POINT_MARGIN;
                  break;
                }
              }
            } else if (entity.dir.x < 0) {
              let tileX = Math.floor(entity.pos.x - entity.size.w / 2);
              let minY = Math.floor(entity.pos.y - entity.size.h / 2);
              let maxY = Math.floor(entity.pos.y + entity.size.h / 2);

              for (var y = minY; y <= maxY; y++) {
                if (getGridTile(grid, tileX, y).blocksMovement) {
                  entity.pos.x =
                    tileX + 1 + entity.size.w / 2 + FLOATING_POINT_MARGIN;
                  break;
                }
              }
            }
          } else if (direction == "y") {
            if (entity.dir.y > 0) {
              let tileY = Math.floor(entity.pos.y + entity.size.h / 2);
              let minX = Math.floor(entity.pos.x - entity.size.w / 2);
              let maxX = Math.floor(entity.pos.x + entity.size.w / 2);

              for (var x = minX; x <= maxX; x++) {
                if (getGridTile(grid, x, tileY).blocksMovement) {
                  entity.pos.y =
                    tileY - entity.size.h / 2 - FLOATING_POINT_MARGIN;
                  break;
                }
              }
            } else if (entity.dir.y < 0) {
              let tileY = Math.floor(entity.pos.y - entity.size.h / 2);
              let minX = Math.floor(entity.pos.x - entity.size.w / 2);
              let maxX = Math.floor(entity.pos.x + entity.size.w / 2);

              for (var x = minX; x <= maxX; x++) {
                if (getGridTile(grid, x, tileY).blocksMovement) {
                  entity.pos.y =
                    tileY + 1 + entity.size.h / 2 + FLOATING_POINT_MARGIN;
                  break;
                }
              }
            }
          }
        }

        return [
          createGrid,
          getGridTile,
          setGridTile,
          getTileLocation,
          DDA,
          handleGridCollision,
          clearGridEntities,
          WIDTH,
          HEIGHT,
        ];
      })();
    </script>

    <script type>
      var [Projectile, AttackHandler] = (function () {
        class Projectile {
          constructor(config, type, pos, dir) {
            this.type = config.type;
            this.prevPos = {
              x: pos.x,
              y: pos.y,
            };
            this.pos = {
              x: pos.x,
              y: pos.y,
            };
            this.size = {
              r: 0.2,
            };
            this.direction = {
              x: dir.x,
              y: dir.y,
            };
            this.speed = config.speed;
            this.damage = config.damage;
            this.type = type;

            this.debugFill = "#AAFFAA";
          }
          update() {
            if (this.type == "bullet") {
              this.prevPos.x = this.pos.x;
              this.prevPos.y = this.pos.y;

              let velX = this.direction.x * this.speed;
              let velY = this.direction.y * this.speed;

              this.pos.y += velY;
              this.pos.x += velX;
            }
          }
        }
        class AttackHandler {
          constructor(config, position, projectileArrayRef) {
            // Weapon configuration
            this.type = config.attack.type;
            this.spatial = config.attack.spatial;
            this.projectile = config.attack.projectile;
            this.timing = structuredClone(config.attack.timing);

            // Weapon states: ready, windup, fire, cooldown
            this.currentState = "ready";

            // Timer for the next state
            this.timer = 0;

            // Current weapon release position
            this.pos = position;

            this.projectileArrayRef = projectileArrayRef;

            this.spiralPauseTimer = 0;
            this.spiralNumber = 0;
          }
          tryAttack() {
            if (this.currentState == "ready") {
              this.currentState = "windup";
              this.timer = this.timing.windup;
              return true;
            } else {
              return false;
            }
          }
          fire(grid, playerPos) {
            if (this.spatial.type == "single") {
              let distToPlayer = Math.sqrt(
                (playerPos.x - this.pos.x) * (playerPos.x - this.pos.x) +
                  (playerPos.y - this.pos.y) * (playerPos.y - this.pos.y),
              );

              this.projectileArrayRef.push(
                new Projectile(
                  this.projectile,
                  this.type,
                  {
                    x: this.pos.x,
                    y: this.pos.y,
                  },
                  {
                    x: (playerPos.x - this.pos.x) / distToPlayer,
                    y: (playerPos.y - this.pos.y) / distToPlayer,
                  },
                ),
              );

              this.currentState = "cooldown";
              this.timer = this.timing.cooldown;
            } else if (this.spatial.type == "radial") {
              let angleTo = 0;
              if (this.spatial.aimed) {
                angleTo = Math.atan2(
                  playerPos.y - this.pos.y,
                  playerPos.x - this.pos.x,
                );
              }

              for (let i = 0; i < this.spatial.number; i++) {
                this.projectileArrayRef.push(
                  new Projectile(
                    this.projectile,
                    this.type,
                    {
                      x: this.pos.x,
                      y: this.pos.y,
                    },
                    {
                      x: Math.cos(
                        angleTo + i * ((2 * Math.PI) / this.spatial.number),
                      ),
                      y: Math.sin(
                        angleTo + i * ((2 * Math.PI) / this.spatial.number),
                      ),
                    },
                  ),
                );
              }

              this.currentState = "cooldown";
              this.timer = this.timing.cooldown;
            } else if (this.spatial.type == "spiral") {
              if (this.spiralPauseTimer <= 0) {
                let angleTo = 0;
                if (this.spatial.aimed) {
                  angleTo = Math.atan2(
                    playerPos.y - this.pos.y,
                    playerPos.x - this.pos.x,
                  );
                }

                if (this.spiralNumber < this.spatial.number) {
                  this.projectileArrayRef.push(
                    new Projectile(
                      this.projectile,
                      this.type,
                      {
                        x: this.pos.x,
                        y: this.pos.y,
                      },
                      {
                        x: Math.cos(
                          angleTo +
                            this.spiralNumber *
                              ((2 * Math.PI) / this.spatial.number),
                        ),
                        y: Math.sin(
                          angleTo +
                            this.spiralNumber *
                              ((2 * Math.PI) / this.spatial.number),
                        ),
                      },
                    ),
                  );

                  this.spiralNumber++;
                  this.spiralPauseTimer = this.spatial.spiralPause;
                } else {
                  this.currentState = "cooldown";
                  this.timer = this.timing.cooldown;
                  this.spiralPauseTimer = 0;
                  this.spiralNumber = 0;
                }
              } else {
                this.spiralPauseTimer--;
              }
            } else if (this.spatial.type == "shotgun") {
              let angleTo = 0;
              angleTo =
                Math.atan2(playerPos.y - this.pos.y, playerPos.x - this.pos.x) -
                this.spatial.shotgunAngleRange / 2 +
                this.spatial.shotgunAngleRange / (2 * this.spatial.number);

              for (let i = 0; i < this.spatial.number; i++) {
                this.projectileArrayRef.push(
                  new Projectile(
                    this.projectile,
                    this.type,
                    {
                      x: this.pos.x,
                      y: this.pos.y,
                    },
                    {
                      x: Math.cos(
                        angleTo +
                          i *
                            (this.spatial.shotgunAngleRange /
                              this.spatial.number),
                      ),
                      y: Math.sin(
                        angleTo +
                          i *
                            (this.spatial.shotgunAngleRange /
                              this.spatial.number),
                      ),
                    },
                  ),
                );
              }

              this.currentState = "cooldown";
              this.timer = this.timing.cooldown;
            }
          }
          update(grid, playerPos) {
            if (this.currentState == "windup") {
              if (this.timer <= 0) {
                this.currentState = "fire";
              }
            } else if (this.currentState == "fire") {
              this.fire(grid, playerPos);
            } else if (this.currentState == "cooldown") {
              if (this.timer <= 0) {
                this.currentState = "ready";
              }
            }

            this.timer--;
          }
        }

        return [Projectile, AttackHandler];
      })();

    <script type>
      var Player = (function () {
        /*
          Configuration options for an player:

          {
            attack: {
              type: "bullet",
              spatial: {
                type: "single" | "shotgun" | "radial",
                number: number,
                aimed: boolean,
                spiralPause: number,
                shotgunAngleRange: number
              },
              firing: {
                type: "constant" | "burst",
                frequency: number,
                burstNumber: number,
                burstPause: number,
              },
              projectile: {
                speed: number,
                modifiers: "none" | "bounce" | "split" | "pierce",
                damage: number
              },
              timing: {
                windup: number,
                cooldown: number
              }
            },
          }
        */
        class Player {
          constructor(config, position, projectileArray) {
            this.pos = {
              x: position.x,
              y: position.y,
            };
            this.size = {
              w: 0.8,
              h: 0.8,
              r: 0.4,
            };

            this.firing = config.attack.firing;

            this.attack = new AttackHandler(config, this.pos, projectileArray);
            this.backupTiming = structuredClone(config.attack.timing);

            this.projectileArrayRef = projectileArray;

            this.attackTimer = 0;
            this.shotsThisRound = 0;
            this.burstTimer = 0;

            this.hearts = config.hearts;
            this.totalHearts = config.hearts;

            this.speed = config.speed;
            this.dir = { x: 0, y: 0 };
            this.rotation = Math.PI / 2;
            this.camHeight = 2;
          }
          handleUserInput() {
            this.dir.x = 0;
            this.dir.y = 0;

            if (events.KeyW) {
              this.dir.y = -1;
            }
            if (events.KeyS) {
              this.dir.y = 1;
            }
            if (events.KeyA) {
              this.dir.x = -1;
            }
            if (events.KeyD) {
              this.dir.x = 1;
            }
            if (events.ArrowLeft) {
              this.rotation += 0.05;
            }
            if (events.ArrowRight) {
              this.rotation -= 0.05;
            }
            if (events.ArrowDown) {
              this.camHeight -= 0.05;
              if (this.camHeight < 1.5) {
                this.camHeight = 1.5;
              }
            }
            if (events.ArrowUp) {
              this.camHeight += 0.05;
            }
          }
          move(grid) {
            if (this.dir.x != 0 && this.dir.y != 0) {
              this.dir.x *= 0.71;
              this.dir.y *= 0.71;
            }

            // Used Claude to help me work out correct rotated movement code

            let cos = Math.cos(-this.rotation);
            let sin = Math.sin(-this.rotation);

            let inputX = this.dir.x;
            let inputY = this.dir.y;

            this.dir.x = -inputY * cos + -inputX * sin;
            this.dir.y = -inputY * sin - -inputX * cos;

            this.pos.x += this.dir.x * this.speed;
            handleGridCollision(grid, this, "x");

            this.pos.y += this.dir.y * this.speed;
            handleGridCollision(grid, this, "y");

            this.centerX = this.pos.x + this.size.w / 2;
            this.centerY = this.pos.y + this.size.h / 2;
          }
          update(grid, enemies, attackOn) {
            let closestEnemyPos = { x: 0, y: 0 };
            let closestEnemyDistSq = Infinity;
            if (enemies.length > 0) {
              for (let enemy of enemies) {
                let enemyDistSq =
                  (enemy.pos.x - this.pos.x) * (enemy.pos.x - this.pos.x) +
                  (enemy.pos.y - this.pos.y) * (enemy.pos.y - this.pos.y);
                if (enemyDistSq < closestEnemyDistSq) {
                  closestEnemyPos = enemy.pos;
                  closestEnemyDistSq = enemyDistSq;
                }
              }
            } else {
              closestEnemyPos.x = this.pos.x + Math.random() - 0.5;
              closestEnemyPos.y = this.pos.y + Math.random() - 0.5;
            }

            this.move(grid);

            this.attack.update(grid, closestEnemyPos);

            if (attackOn) {
              if (this.attackTimer <= 0) {
                if (this.firing.type == "constant") {
                  if (this.attack.tryAttack())
                    this.attackTimer = this.firing.frequency;
                } else if (this.firing.type == "burst") {
                  console.log(
                    this.attack.type,
                    this.shotsThisRound,
                    this.attack.spatial.number,
                  );
                  if (
                    (this.attack.type != "single" &&
                      this.shotsThisRound < this.firing.burstNumber) ||
                    (this.attack.type == "single" &&
                      this.shotsThisRound < this.attack.spatial.number)
                  ) {
                    if (this.attack.tryAttack()) {
                      this.shotsThisRound++;
                      this.attack.timing.windup = 0;
                      this.attack.timing.cooldown = this.firing.burstPause;
                    }
                  } else {
                    this.attackTimer = this.firing.frequency;
                    this.shotsThisRound = 0;
                    this.attack.timing.windup = this.backupTiming.windup;
                  }
                }
              } else {
                this.attackTimer--;
              }
            }
          }
        }

        return Player;
      })();

      var Enemy = (function () {
        class MovementHandler {
          constructor(config, position, size) {
            this.type = config.movement.type;
            this.speed = config.movement.speed;

            this.pos = position;
            this.size = size;

            this.dir = {
              x: 0,
              y: 0,
            };
            this.vel = {
              x: 0,
              y: 0,
            };
            this.isCorrectingRadius = false;
          }

          calculateDistTo(pos) {
            return Math.sqrt(
              (pos.x - this.pos.x) * (pos.x - this.pos.x) +
                (pos.y - this.pos.y) * (pos.y - this.pos.y),
            );
          }

          blindChaseToward(pos, distance) {
            let dist = distance || this.calculateDistTo(pos);
            this.dir.x = (pos.x - this.pos.x) / dist;
            this.dir.y = (pos.y - this.pos.y) / dist;
          }
          blindChaseAway(pos, distance) {
            let dist = distance || this.calculateDistTo(pos);
            this.dir.x = -(pos.x - this.pos.x) / dist;
            this.dir.y = -(pos.y - this.pos.y) / dist;
          }
          blindChaseNeutral(pos, distance) {
            this.dir.x = 0;
            this.dir.y = 0;
          }

          // Used AI to help me work out how to do spirals correctly, esp. w/o using trig or angles.
          blindOrbitToward(pos, distance) {
            const SPIRAL_STRENGTH = 0.5;

            let r = distance;
            let rx = (pos.x - this.pos.x) / r;
            let ry = (pos.y - this.pos.y) / r;

            let px = -ry;
            let py = rx;

            this.dir.x = px + rx * SPIRAL_STRENGTH;
            this.dir.y = py + ry * SPIRAL_STRENGTH;
          }

          blindOrbitAway(pos, distance) {
            const SPIRAL_STRENGTH = 0.5;

            let r = distance;
            let rx = (pos.x - this.pos.x) / r;
            let ry = (pos.y - this.pos.y) / r;

            let px = -ry;
            let py = rx;

            this.dir.x = px - rx * SPIRAL_STRENGTH;
            this.dir.y = py - ry * SPIRAL_STRENGTH;
          }
          blindOrbitNeutral(pos, distance) {
            let r = distance;

            let rx = (pos.x - this.pos.x) / r;
            let ry = (pos.y - this.pos.y) / r;

            let px = -ry;
            let py = rx;

            this.dir.x = px;
            this.dir.y = py;
          }

          blindWander() {
            const DIST = 5;
            const R = 1;
            let circleX = this.pos.x + this.dir.x * DIST;
            let circleY = this.pos.y + this.dir.y * DIST;

            let randomTheta = Math.random() * 2 * Math.PI;
            let randomPointX = circleX + Math.cos(randomTheta) * R;
            let randomPointY = circleY + Math.sin(randomTheta) * R;

            let dist = this.calculateDistTo({
              x: randomPointX,
              y: randomPointY,
            });
            this.dir.x = (randomPointX - this.pos.x) / dist;
            this.dir.y = (randomPointY - this.pos.y) / dist;
          }

          handleMovement(
            grid,
            dist,
            playerPos,
            prefDist,
            towards,
            away,
            neutral,
          ) {
            if (this.isCorrectingRadius) {
              if (floatsEqual(dist, prefDist, this.speed)) {
                this.isCorrectingRadius = false;
              } else {
                if (dist > prefDist) {
                  towards(playerPos, dist);
                } else if (dist < prefDist) {
                  away(playerPos, dist);
                }
              }
            } else {
              neutral(playerPos, dist);
            }
          }

          update(grid, playerPos, engagement) {
            let distToPlayer = this.calculateDistTo(playerPos);
            if (
              !this.isCorrectingRadius &&
              (distToPlayer > engagement.maxDist ||
                distToPlayer < engagement.minDist)
            )
              this.isCorrectingRadius = true;

            if (this.type == "chase") {

                grid,
                distToPlayer,
                playerPos,
                engagement.preferredDist,
                (p, d) => this.blindChaseToward(p, d),
                (p, d) => this.blindChaseAway(p, d),
                (p, d) => this.blindChaseNeutral(p, d),
              );
            } else if (this.type == "orbit") {
              // AI helped me work out how to do this correctly and efficiently.
              // Avoids using trig functions and angle calculations. Very nice.

              this.handleMovement(
                grid,
                distToPlayer,
                playerPos,
                engagement.preferredDist,
                (p, d) => this.blindOrbitToward(p, d),
                (p, d) => this.blindOrbitAway(p, d),
                (p, d) => this.blindOrbitNeutral(p, d),
              );
            } else if (this.type == "wander") {
              this.blindWander();
            }

            this.pos.x += this.dir.x * this.speed;
            handleGridCollision(grid, this, "x");

      // first, generate room layouts

      /*

type: organic | symmetrical
symmetryAxis: 'x', 'y', 'xy'
wallNumber: a number determining the number of wall clusters
holeNumber: a number determining the number of hole clusters
clusterSize: a number determining the size of a cluster

      var createRoom = (function () {
        function setMirrored(mirror, grid, type, x, y, w, h) {
          let blocksLOS;
          let blocksMovement;

          if (type == "wall") {
            blocksLOS = true;
            blocksMovement = true;
          } else if (type == "hole") {
            blocksLOS = false;
            blocksMovement = true;
          }

          if (mirror == "x&y") {
            setGridTile(grid, x, y, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
            setGridTile(grid, GRID_WIDTH - x - 1, y, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
            setGridTile(grid, x, GRID_HEIGHT - y - 1, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
            setGridTile(grid, GRID_WIDTH - x - 1, GRID_HEIGHT - y - 1, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
          } else if (mirror == "xy") {
            setGridTile(grid, x, y, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
            setGridTile(
              grid,
              Math.abs(GRID_WIDTH - x - 1),
              Math.abs(GRID_HEIGHT - y - 1),
              {
                type,
                blocksLOS,
                blocksMovement,
                entitiesContained: [],
              },
            );
          } else if (mirror == "y") {
            setGridTile(grid, x, y, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
            setGridTile(grid, x, GRID_HEIGHT - y - 1, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
          } else if (mirror == "x") {
            setGridTile(grid, x, y, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
            setGridTile(grid, GRID_WIDTH - x - 1, y, {
              type,
              blocksLOS,
              blocksMovement,
              entitiesContained: [],
            });
          }
        }
        function createRoom(config) {
          let room = createGrid();

          // Create the walls and doors
          for (let i in room) {
            let tilePos = getTileLocation(i);
            if (
              tilePos.x == 0 ||
              tilePos.y == 0 ||
              tilePos.x == GRID_WIDTH - 1 ||
              tilePos.y == GRID_HEIGHT - 1
            ) {
              room[i].type = "wall";
              room[i].blocksLOS = "true";
              room[i].blocksMovement = true;
            }

            if (
              ((tilePos.x == Math.floor((GRID_WIDTH - 1) / 2) ||
                tilePos.x == Math.ceil((GRID_WIDTH - 1) / 2)) &&
                (tilePos.y == 0 || tilePos.y == GRID_HEIGHT - 1)) ||
              ((tilePos.y == Math.floor((GRID_HEIGHT - 1) / 2) ||
                tilePos.y == Math.ceil((GRID_HEIGHT - 1) / 2)) &&
                (tilePos.x == 0 || tilePos.x == GRID_WIDTH - 1))
            ) {
              room[i].type = "door";
              room[i].blocksLOS = "true";
              room[i].blocksMovement = true;
            }
          }

          if (config.type == "symmetric") {
            let maxX;
            let maxY;

            if (config.symmetryType == "x&y") {
              maxX = Math.floor(GRID_WIDTH / 2);
              maxY = Math.floor(GRID_HEIGHT / 2);
            } else if (config.symmetryType == "y") {
              maxX = Math.floor(GRID_WIDTH);
              maxY = Math.floor(GRID_HEIGHT / 2);
            } else if (config.symmetryType == "x") {
              maxX = Math.floor(GRID_WIDTH / 2);
              maxY = Math.floor(GRID_HEIGHT);
            } else if (config.symmetryType == "xy") {
              maxX = Math.floor(GRID_WIDTH);
              maxY = Math.floor(GRID_HEIGHT);
            }

    <script type>
      var [generateDungeonLayout] = (function () {
        /*

let's go isaac style: https://www.boristhebrave.com/2020/09/12/dungeon-generation-in-binding-of-isaac/

*/
        function filledNeighbors(grid, loc) {
          let neighborOffsets = [];

          if (loc % 10 != 0) {
            neighborOffsets.push(-1);
          }
          if (loc % 10 != 9) {
            neighborOffsets.push(1);
          }
          if (Math.floor(loc / 10) != 0) {
            neighborOffsets.push(-10);
          }
          if (Math.floor(loc / 10) != 9) {
            neighborOffsets.push(10);
          }
          let num = 0;
          for (let offset of neighborOffsets) {
            if (grid[loc + offset] != 0) num++;
          }
          return num;
        }
        function generatePotentialDungeon(level) {
          let grid = Array(10 * 10).fill(0);
          let numRoomsNeeded = Math.floor(Math.random() * 2 + 5 + level * 2.6);

          let startingRoom = 35;
          grid[startingRoom] = {
            type: "entrance",
            end: false,
            start: true,
            cleared: false,
            hasComputer: false,
          };

          let queue = [startingRoom];

          for (let i = 0; i < queue.length; i++) {
            let neighborOffsets = [];
            let loc = queue[i];

            if (loc % 10 != 0) {
              neighborOffsets.push(-1);
            }
            if (loc % 10 != 9) {
              neighborOffsets.push(1);
            }
            if (Math.floor(loc / 10) != 0) {
              neighborOffsets.push(-10);
            }
            if (Math.floor(loc / 10) != 9) {
              neighborOffsets.push(10);
            }

            let addedRoom = false;
            for (let offset of neighborOffsets) {
              let neighborLoc = loc + offset;
              if (grid[neighborLoc] != 0) continue;
              if (filledNeighbors(grid, neighborLoc) > 1) continue;
              if (queue.length == numRoomsNeeded) continue;
              if (Math.random() < 0.5) continue;

              grid[neighborLoc] = {
                type: "normal",
                end: false,
                start: false,
                cleared: false,
                hasComputer: Math.random() < 0.7,
              };
              queue.push(neighborLoc);
              addedRoom = true;
            }
            if (!addedRoom) {
              grid[startingRoom].end = true;
            }
          }
          grid[queue[queue.length - 1]].type = "boss";
          grid[queue[queue.length - 1]].hasComputer = true;

          return { rooms: queue.length, numRoomsNeeded, grid };
        }
        function bossRoomNextToStartingRoom(grid) {
          let bossLoc;
          let startLoc;

          for (let i in grid) {
            if (grid[i].type == "boss") {
              bossLoc = i;
            }
            if (grid[i].start) {
              startLoc = i;
            }
          }

          let diff = Math.abs(bossLoc - startLoc);
          return diff == 10 || diff == 1;
        }

        function generateDungeonLayout(level) {
          let dungeon = generatePotentialDungeon(level);
          while (
            dungeon.rooms != dungeon.numRoomsNeeded ||
            bossRoomNextToStartingRoom(dungeon.grid)
          ) {
            dungeon = generatePotentialDungeon(level);
          }

          return dungeon;
        }

        return [generateDungeonLayout];
      })();

              } else if (tile.type == "computer") {
                let loc = getTileLocation(i);
                let translation = [loc.x + 0.5, 0.5, loc.y + 0.5];

                if (tile.computerUsed == false) {
                  renderer.scene.addComponent(
                    new RenderComponent(
                      "models/ComputerTower",
                      { translation },
                      { strength: 5, color: [1.0, 0.7, 1.0] },
                    ),
                    "computer",
                  );
                } else {
                  renderer.scene.addComponent(
                    new RenderComponent(
                      "models/ComputerTower",
                      { translation },
                      { strength: 0.2, color: [1.0, 0.7, 1.0] },
                    ),
                    "computer",
                  );
                }
              }
            }

            renderer.scene.removeComponentsByName("bullet");
            for (let i of this.enemyProjectiles) {
              let renderComponent = new RenderComponent(
                "models/Bullet",
                {
                  translation: [i.pos.x, 0.5, i.pos.y],
                },
                { strength: 2, color: [1.0, 0.7, 0.7] },
              );
              renderer.scene.addComponent(renderComponent, "bullet");
            }
            for (let i of this.playerProjectiles) {
              let renderComponent = new RenderComponent(
                "models/Bullet",
                {
                  translation: [i.pos.x, 0.5, i.pos.y],
                },
                { strength: 2, color: [0.7, 0.7, 1.0] },
              );
              renderer.scene.addComponent(renderComponent, "bullet");
            }

            renderer.scene.removeComponentsByName("enemy");
            for (let i of this.enemies) {
              let renderComponent = new RenderComponent(
                i.mesh,
                {
                  translation: [i.pos.x, 0.5, i.pos.y],
                },
                { strength: 1, color: [0.5, 0.1, 0.1] },
              );
              renderComponent.transform.setRotation(0, i.rotation, 0);
              i.rotation += i.rotationSpeed;
              renderer.scene.addComponent(renderComponent, "enemy");
            }
          }
        }

        return LevelManager;
      })();
    </script>
    <!-- upgrades -->
    <script type>
      /*

{
            attack: {
              type: "bullet",
              spatial: {
                type: "single" | "shotgun" | "radial",
                number: number,
                aimed: boolean,
                spiralPause: number,
                shotgunAngleRange: number
              },
              firing: {
                type: "constant" | "burst",
                frequency: number,
                burstNumber: number,
                singlesBurst: number,
                burstPause: number,
              },
              projectile: {
                speed: number,
                modifiers: "none" | "bounce" | "split" | "pierce",
                damage: number
              },
              timing: {
                windup: number,
                cooldown: number
              }
            },
          }
  */

      var upgrades = {
        light: [
          {
            text: "Increase walking speed by 1%",
            attribute: "speed",
            operator: "multiply",
            value: 1.01,
          },
          {
            text: "Increase projectile speed by 1%",
            attribute: "attack.projectile.speed",
            operator: "multiply",
            value: 1.01,
          },
          {
            text: "Increase projectile damage effect by 1%",
            attribute: "attack.projectile.damage",
            operator: "multiply",
            value: 1.01,
          },
          {
            text: "Decrease cooldown time by 1%",
            attribute: "attack.timing.cooldown",
            operator: "multiply",
            value: 0.99,
          },
          {
            text: "Decrease windup time by 1%",
            attribute: "attack.timing.windup",
            operator: "multiply",
            value: 0.99,
          },
          {
            text: "Decrease firing delay by 1%",
            attribute: "attack.firing.frequency",
            operator: "multiply",
            value: 0.99,
          },
          {
            text: "Restore lives by 1",
            attribute: "hearts",
            operator: "add",
            value: 1,
          },
          {
            text: "Increase number of bullets fired by 1",
            attribute: "attack.spatial.number",
            operator: "add",
            value: 1,
          },
        ],
        normal: [
          {
            text: "Increase projectile damage effect by 5%",
            attribute: "attack.projectile.damage",
            operator: "multiply",
            value: 1.05,
          },
          {
            text: "Increase number of bullets fired by 3",
            attribute: "attack.spatial.number",
            operator: "add",
            value: 3,
          },
          {
            text: "Decrease firing delay by 5%",
            attribute: "attack.firing.frequency",
            operator: "multiply",
            value: 0.95,
          },
          {
            text: "Increase projectile speed by 5%",
            attribute: "attack.projectile.speed",
            operator: "multiply",
            value: 1.05,
          },
          {
            text: "Increase lives capacity by 1",
            attribute: "totalHearts",
            operator: "add",
            value: 1,
          },
          {
            text: "Restore lives by 3",
            attribute: "hearts",
            operator: "add",
            value: 3,
          },
        ],
        boss: [
          {
            text: "Upgrade weapon to shotgun",
            attribute: "attack.spatial.type",
            operator: "equals",
            value: "shotgun",
          },
          {
            text: "Upgrade weapon to radial",
            attribute: "attack.spatial.type",
            operator: "equals",
            value: "radial",
          },
          {
            text: "Increase burst number by 1",
            attribute: "attack.firing.burstNumber",
            operator: "add",
            value: 1,
          },
          {
            text: "Increase number of bullets fired by 5",
            attribute: "attack.spatial.number",
            operator: "add",
            value: 3,
          },
          {
            text: "Increase lives capacity by 3",
            attribute: "totalHearts",
            operator: "add",
            value: 3,
          },
        ],
      };

      var [pickUpgrades, applyUpgrade, upgradeScreen] = (function () {
        function pickRandom(array) {
          return array[Math.floor(Math.random() * array.length)];
        }
        function pickUpgrades(roomType) {
          let u;

          if (roomType == "normal") {
            let one;
            let two;
            let three;

            while (one == two || two == three || one == three) {
              one =
                Math.random() < 0.9
                  ? pickRandom(upgrades.light)
                  : pickRandom(upgrades.normal);
              two =
                Math.random() < 0.8
                  ? pickRandom(upgrades.light)
                  : pickRandom(upgrades.normal);
              three =
                Math.random() < 0.7
                  ? pickRandom(upgrades.light)
                  : pickRandom(upgrades.normal);
            }

            u = [one, two, three];
          } else if (roomType == "boss") {
            let one;
            let two;
            let three;

            while (one == two || two == three || one == three) {
              one =
                Math.random() < 0.9
                  ? pickRandom(upgrades.normal)
                  : pickRandom(upgrades.boss);
              two =
                Math.random() < 0.8
                  ? pickRandom(upgrades.normal)
                  : pickRandom(upgrades.boss);
              three =
                Math.random() < 0.7
                  ? pickRandom(upgrades.normal)
                  : pickRandom(upgrades.boss);
            }

            u = [one, two, three];
          }

          return u;
        }
        function applyUpgrade(upgrade, playerConfig, player) {
          let attribute = upgrade.attribute.split(".");
          let parentObj = playerConfig;
          for (let i in attribute) {
            if (i != attribute.length - 1) parentObj = parentObj[attribute[i]];
          }
          switch (upgrade.operator) {
            case "add":
              parentObj[attribute[attribute.length - 1]] += upgrade.value;
              break;
            case "multiply":
              parentObj[attribute[attribute.length - 1]] *= upgrade.value;
              break;
            case "equals":
              parentObj[attribute[attribute.length - 1]] = upgrade.value;
              break;
          }
          console.log(playerConfig);
          player.backupTiming = structuredClone(playerConfig.attack.timing);
          player.attack.timing = structuredClone(playerConfig.attack.timing);
          if (player.hearts > player.totalHearts)
            player.hearts = player.totalHearts;
        }

        function upgradeScreen(selectedUpgrades, selectUpgradeSlot) {
          const canvas = document.getElementById("overlay");
          const ctx = canvas.getContext("2d");

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.font = "48px sans-serif";
          ctx.fillStyle = "rgba(255, 255, 255, 1.0)";
          ctx.textAlign = "center";
          ctx.fillText("UPGRADE UNLOCKED!", canvas.width / 2, 100);

          ctx.font = "24px sans-serif";
          ctx.fillText("choose one upgrade", canvas.width / 2, 200);

          for (let i in selectedUpgrades) {
            ctx.strokeStyle = "white";
            ctx.strokeWidth = 2;
            if (
              mouseX > 50 &&
              mouseX < canvas.width - 100 &&
              mouseY > 250 + 72 * i &&
              mouseY < 250 + 72 * i + 48
            ) {
              ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
              ctx.fillRect(50, 250 + 72 * i, canvas.width - 100, 48);
              ctx.fillText(
                selectedUpgrades[i].text,
                canvas.width / 2,
                250 + 72 * i + 36,
              );
              if (mousePressed) {
                selectUpgradeSlot.upgrade = selectedUpgrades[i];
                return true;
              }
            } else {
              ctx.strokeRect(50, 250 + 72 * i, canvas.width - 100, 48);
              ctx.strokeText(
                selectedUpgrades[i].text,
                canvas.width / 2,
                250 + 72 * i + 36,
              );
            }
          }
        }

        return [pickUpgrades, applyUpgrade, upgradeScreen];
      })();
    </script>

    <!-- main -->
    <script type>
      (function () {
        const renderer = new Renderer("render");
        const overlay = document.getElementById("overlay");
        const overlay_ctx = overlay.getContext("2d");

        renderer.assetManager.loadFromBase64("models", models);

        let currentState = "gameplay";
        let selectedUpgrades;
        let nextUpgrade = {};

        console.log(renderer.assetManager);

        let currentLevel = new LevelManager(0, currentPlayerConfig);

        function main() {
          prepDebugCanvas();

          if (currentState == "gameplay") {
            overlay_ctx.clearRect(0, 0, overlay.width, overlay.height);
            currentLevel.update();
            currentLevel.display(renderer);
            currentLevel.debugDisplay();

            if (currentLevel.upgrade) {
              currentLevel.upgrade = false;
              currentState = "upgrade";
              selectedUpgrades = pickUpgrades(
                currentLevel.dungeon[currentLevel.currentRoom].boss
                  ? "boss"
                  : "normal",
              );
            }
            //currentState = "upgrade";
            //selectedUpgrades = pickUpgrades("boss");
          } else if (currentState == "upgrade") {
            if (upgradeScreen(selectedUpgrades, nextUpgrade)) {
              currentState = "gameplay";
              applyUpgrade(
                nextUpgrade.upgrade,
                currentPlayerConfig,
                currentLevel.player,
              );
            }
          }
          renderer.render();
          requestAnimationFrame(main);
        }
        requestAnimationFrame(main);
      })();
    </script>
